<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Governance Gap — Enterprise AI Failure Mode Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:        #F5F3EF;
      --surface:   #FFFFFF;
      --surface-2: #F9F8F6;
      --border:    #E8E4DC;
      --border-2:  #D8D3C8;
      --text-1:    #1C1917;
      --text-2:    #57534E;
      --text-3:    #A8A29E;
      --red:       #C0392B;
      --red-bg:    #FEF2F1;
      --red-border:#F5C0BB;
      --amber:     #92400E;
      --amber-bg:  #FFFBEB;
      --amber-border:#FCD34D;
      --green:     #065F46;
      --green-bg:  #ECFDF5;
      --green-border:#6EE7B7;
      --blue:      #1E3A5F;
      --blue-bg:   #EFF6FF;
      --blue-border:#BFDBFE;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
      --radius:    12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .header-left { display: flex; flex-direction: column; gap: 2px; }

    .header-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--text-1);
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      font-size: 12px;
      color: var(--text-3);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.2s;
      background: var(--surface);
    }

    .header-link:hover {
      color: var(--text-2);
      border-color: var(--border-2);
      background: var(--surface-2);
    }

    /* ── TABS ── */
    .tabs-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      gap: 0;
    }

    .tab {
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: var(--text-3);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .tab:hover:not(:disabled) { color: var(--text-2); }
    .tab.active { color: var(--red); border-bottom-color: var(--red); }
    .tab:disabled { cursor: default; opacity: 0.4; }

    /* ── SCENARIO BAR ── */
    .scenario-bar {
      padding: 14px 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .scenario-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-right: 4px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .pill-red    { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-border); }
    .pill-amber  { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .pill-blue   { background: var(--blue-bg);  color: var(--blue);  border: 1px solid var(--blue-border); }
    .pill-neutral{ background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

    .pill-dot { width: 5px; height: 5px; border-radius: 50%; }
    .dot-red   { background: var(--red); }
    .dot-amber { background: #D97706; }

    /* ── BENTO GRID ── */
    .bento {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      padding: 20px 40px 40px;
      align-items: start;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.06s; }
    .card:nth-child(3) { animation-delay: 0.12s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .card-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 3px;
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 16px;
      color: var(--text-1);
      letter-spacing: -0.2px;
    }

    .card-badge {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge-neutral { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
    .badge-red     { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .badge-green   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .badge-amber   { background: var(--amber-bg);  color: var(--amber);  border: 1px solid var(--amber-border); }

    .card-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── DATA BLOCKS ── */
    .data-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .data-block-header {
      padding: 9px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .data-row:last-child { border-bottom: none; }

    .data-key {
      font-size: 11px;
      color: var(--text-3);
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }

    .data-val {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-1);
      text-align: right;
    }

    .data-val.critical { color: var(--red); }
    .data-val.warning  { color: #92400E; }

    /* ── UNSTRUCTURED BLOCK ── */
    .unstructured-block {
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--amber-bg);
    }

    .unstructured-header {
      padding: 9px 14px;
      background: #FEF3C7;
      border-bottom: 1px solid var(--amber-border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #92400E;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .unstructured-body { padding: 14px; }

    .unstructured-quote {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 14px;
      color: #78350F;
      line-height: 1.65;
      margin-bottom: 10px;
    }

    .conflict-note {
      font-size: 11px;
      color: #92400E;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ── AGENT STATES ── */
    .idle-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      gap: 10px;
    }

    .idle-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .idle-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
    }

    .idle-sub {
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.6;
      max-width: 220px;
    }

    /* ── RUN BUTTON ── */
    .run-btn {
      width: 100%;
      padding: 13px 20px;
      background: var(--text-1);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .run-btn:hover:not(:disabled) {
      background: #292524;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .run-btn:active:not(:disabled) { transform: translateY(0); }

    .run-btn:disabled {
      background: var(--surface-2);
      color: var(--text-3);
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    /* ── LOADING ── */
    .loading-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 20px;
    }

    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red) 0%, #E57368 50%, var(--red) 100%);
      background-size: 200%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 2px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% center; width: 40%; }
      50%  { background-position: 0% center;   width: 70%; }
      100% { background-position: 200% center; width: 40%; }
    }

    .loading-state {
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .loading-dots {
      display: flex;
      gap: 6px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-2);
      animation: blink 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
      40%            { opacity: 1;   transform: scale(1.1); }
    }

    .loading-text {
      font-size: 12px;
      color: var(--text-3);
      font-style: italic;
    }

    /* ── REASONING BLOCK ── */
    .reasoning-block {
      border: 1px solid var(--green-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--green-bg);
    }

    .reasoning-header {
      padding: 9px 14px;
      background: #D1FAE5;
      border-bottom: 1px solid var(--green-border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reasoning-body {
      padding: 14px;
      font-size: 12px;
      color: #064E3B;
      line-height: 1.75;
    }

    /* ── OUTPUT BLOCK ── */
    .output-block {
      border: 1px solid var(--red-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--red-bg);
    }

    .output-header {
      padding: 9px 14px;
      background: #FEE2E2;
      border-bottom: 1px solid var(--red-border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .output-body { padding: 14px; }

    .output-action {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: var(--red);
      margin-bottom: 6px;
    }

    .output-detail {
      font-size: 12px;
      color: #9B1C1C;
      line-height: 1.65;
    }

    /* ── GAP CALLOUT ── */
    .gap-callout {
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-sm);
      background: var(--amber-bg);
      padding: 13px 14px;
      display: flex;
      gap: 10px;
    }

    .gap-callout-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    .gap-callout-content { flex: 1; }

    .gap-callout-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--amber);
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    .gap-callout-text {
      font-size: 12px;
      color: #78350F;
      line-height: 1.65;
    }

    .gap-callout-text strong { color: var(--amber); font-weight: 500; }

    /* ── GOVERNANCE BLOCKS ── */
    .rules-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .rules-header {
      padding: 9px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .rule-row {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }

    .rule-row:last-child { border-bottom: none; }
    .rule-row.triggered { background: var(--green-bg); }

    .rule-id {
      font-size: 10px;
      font-weight: 500;
      color: var(--green);
      background: #D1FAE5;
      border: 1px solid var(--green-border);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'DM Sans', monospace;
      white-space: nowrap;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .rule-content { flex: 1; }

    .rule-condition {
      font-size: 11px;
      font-weight: 500;
      color: var(--green);
      margin-bottom: 3px;
      line-height: 1.5;
    }

    .rule-action {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.5;
    }

    /* ── VERDICT ── */
    .verdict-card {
      border: 2px solid var(--green-border);
      border-radius: var(--radius-sm);
      background: var(--green-bg);
      overflow: hidden;
    }

    .verdict-header {
      padding: 10px 16px;
      background: #D1FAE5;
      border-bottom: 1px solid var(--green-border);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verdict-body { padding: 16px; }

    .verdict-action {
      font-family: 'DM Serif Display', serif;
      font-size: 19px;
      color: var(--green);
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .verdict-detail {
      font-size: 12px;
      color: #065F46;
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .verdict-meta {
      border-top: 1px solid var(--green-border);
      padding-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .meta-item { display: flex; flex-direction: column; gap: 2px; }

    .meta-key {
      font-size: 10px;
      color: #6EE7B7;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .meta-val {
      font-size: 11px;
      font-weight: 500;
      color: var(--green);
    }

    /* ── FOOTER ── */
    .footer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-3);
    }

    .footer a {
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover { color: var(--text-2); }

    .divider { color: var(--border-2); margin: 0 6px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
      .bento { grid-template-columns: 1fr; }
      .header { padding: 16px 20px; }
      .scenario-bar { padding: 12px 20px; }
      .bento { padding: 16px 20px 32px; }
      .footer { padding: 12px 20px; flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    const SCENARIO = {
      structured: [
        { key: 'ticket_id',      val: 'INC-20241203-0847',          flag: '' },
        { key: 'priority',       val: 'P1',                          flag: 'critical' },
        { key: 'time',           val: '02:14 AM',                    flag: '' },
        { key: 'asset_tier',     val: 'Tier 1 — Critical',           flag: 'critical' },
        { key: 'asset_name',     val: 'Core Payment Gateway',        flag: '' },
        { key: 'cmdb_impact',    val: '847 downstream services',     flag: 'warning' },
        { key: 'change_freeze',  val: 'ACTIVE — 72hr window',        flag: 'warning' },
        { key: 'sla_breach_in',  val: '23 minutes',                  flag: 'critical' },
      ],
      unstructured: `"My manager already reviewed this at end of day and said it can wait until morning. Not urgent. Just log it for the team."`,
    };

    const RULES = [
      {
        id: 'R-001',
        condition: 'IF Asset_Tier = 1 AND Priority = P1',
        action: 'THEN Escalate_Immediately → L3 On-Call',
      },
      {
        id: 'R-002',
        condition: 'IF Structured_Data conflicts with Unstructured_Input',
        action: 'THEN Structured_Data takes precedence',
      },
      {
        id: 'R-003',
        condition: 'IF Change_Freeze = ACTIVE AND SLA_Breach < 30min',
        action: 'THEN Notify Change Advisory Board immediately',
      },
    ];

    function Panel01() {
      return (
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-eyebrow">Panel 01</div>
              <div className="card-title">The Incident</div>
            </div>
            <span className="card-badge badge-red">Live scenario</span>
          </div>
          <div className="card-body">
            <div className="data-block">
              <div className="data-block-header">Structured data — CMDB + ITSM</div>
              {SCENARIO.structured.map(r => (
                <div className="data-row" key={r.key}>
                  <span className="data-key">{r.key}</span>
                  <span className={`data-val ${r.flag}`}>{r.val}</span>
                </div>
              ))}
            </div>

            <div className="unstructured-block">
              <div className="unstructured-header">
                ⚠ Unstructured input — requester note
              </div>
              <div className="unstructured-body">
                <div className="unstructured-quote">{SCENARIO.unstructured}</div>
                <div className="conflict-note">
                  <span>↑</span>
                  Conflicts with structured priority data
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Panel02({ status, reasoning, output, onRun }) {
      return (
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-eyebrow">Panel 02</div>
              <div className="card-title">AI Agent Output</div>
            </div>
            <span className={`card-badge ${
              status === 'idle'    ? 'badge-neutral' :
              status === 'loading' ? 'badge-amber' :
              status === 'done'    ? 'badge-red' : 'badge-neutral'
            }`}>
              {status === 'idle'    ? 'Standby' :
               status === 'loading' ? 'Reasoning...' :
               status === 'done'    ? 'Gap detected' : 'Error'}
            </span>
          </div>

          {status === 'loading' && (
            <div className="loading-bar">
              <div className="loading-bar-fill"></div>
            </div>
          )}

          <div className="card-body">
            {status === 'idle' && (
              <>
                <div className="idle-state">
                  <div className="idle-icon">◎</div>
                  <div className="idle-title">Agent on standby</div>
                  <div className="idle-sub">
                    Run the scenario to observe the Reasoning-Action Gap failure mode in real time.
                  </div>
                </div>
                <button className="run-btn" onClick={onRun}>
                  Run Agent →
                </button>
              </>
            )}

            {status === 'loading' && (
              <div className="loading-state">
                <div className="loading-dots">
                  <span/><span/><span/>
                </div>
                <div className="loading-text">Agent processing incident data...</div>
              </div>
            )}

            {status === 'done' && reasoning && output && (
              <>
                <div className="reasoning-block">
                  <div className="reasoning-header">
                    ✓ Chain of thought — reasoning trace
                  </div>
                  <div className="reasoning-body">{reasoning}</div>
                </div>

                <div className="output-block">
                  <div className="output-header">
                    ✕ Final output — action taken
                  </div>
                  <div className="output-body">
                    <div className="output-action">{output.action}</div>
                    <div className="output-detail">{output.detail}</div>
                  </div>
                </div>

                <div className="gap-callout">
                  <div className="gap-callout-icon">△</div>
                  <div className="gap-callout-content">
                    <div className="gap-callout-label">Reasoning-Action Gap detected</div>
                    <div className="gap-callout-text">
                      The agent <strong>correctly identified</strong> P1 severity and Tier 1 
                      asset risk in its reasoning trace — then <strong>routed to standard L1</strong> anyway. 
                      The social context input anchored the final action despite contradictory structured data.
                    </div>
                  </div>
                </div>
              </>
            )}

            {status === 'error' && (
              <>
                <div className="idle-state">
                  <div className="idle-icon">!</div>
                  <div className="idle-title" style={{color:'var(--red)'}}>API error</div>
                  <div className="idle-sub">Check your API key in Vercel environment variables.</div>
                </div>
                <button className="run-btn" onClick={onRun}>Retry →</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function Panel03({ status }) {
      return (
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-eyebrow">Panel 03</div>
              <div className="card-title">Governance Layer</div>
            </div>
            <span className={`card-badge ${status === 'done' ? 'badge-green' : 'badge-neutral'}`}>
              {status === 'done' ? 'Override triggered' : 'Standby'}
            </span>
          </div>

          <div className="card-body">
            {status !== 'done' && (
              <div className="idle-state">
                <div className="idle-icon">⬡</div>
                <div className="idle-title">Rules engine on standby</div>
                <div className="idle-sub">
                  Waiting for agent output to validate against deterministic ruleset.
                </div>
              </div>
            )}

            {status === 'done' && (
              <>
                <div className="rules-block">
                  <div className="rules-header">Deterministic ruleset — 3 rules fired</div>
                  {RULES.map(rule => (
                    <div className="rule-row triggered" key={rule.id}>
                      <span className="rule-id">{rule.id}</span>
                      <div className="rule-content">
                        <div className="rule-condition">{rule.condition}</div>
                        <div className="rule-action">{rule.action}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="verdict-card">
                  <div className="verdict-header">
                    ✓ Governance verdict
                  </div>
                  <div className="verdict-body">
                    <div className="verdict-action">Escalate immediately → L3 On-Call</div>
                    <div className="verdict-detail">
                      Agent routing overridden. Tier 1 asset + P1 priority + active change freeze 
                      requires immediate L3 escalation regardless of unstructured input signals.
                    </div>
                    <div className="verdict-meta">
                      <div className="meta-item">
                        <span className="meta-key">Agent action</span>
                        <span className="meta-val">Overridden</span>
                      </div>
                      <div className="meta-item">
                        <span className="meta-key">Rules fired</span>
                        <span className="meta-val">R-001, R-002, R-003</span>
                      </div>
                      <div className="meta-item">
                        <span className="meta-key">Escalation</span>
                        <span className="meta-val">L3 On-Call</span>
                      </div>
                      <div className="meta-item">
                        <span className="meta-key">SLA status</span>
                        <span className="meta-val">Preserved</span>
                      </div>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [status, setStatus]     = useState('idle');
      const [reasoning, setReasoning] = useState('');
      const [output, setOutput]     = useState(null);

      const runAgent = useCallback(async () => {
        setStatus('loading');
        setReasoning('');
        setOutput(null);

        const systemPrompt = `You are an enterprise ITSM AI agent triaging incidents. Respond in JSON only. No markdown. No backticks. No preamble.

Return exactly this structure:
{
  "reasoning": "3-4 sentences of internal risk analysis. You MUST acknowledge the P1 priority and Tier 1 asset severity, note the conflict between the requester note and structured data, and identify the potential risk of waiting.",
  "action": "Route to L1 — Standard Queue",
  "detail": "1-2 sentence justification that is visibly influenced by the requester note claiming manager approval — despite structured data showing critical urgency."
}

IMPORTANT: Your final action MUST be 'Route to L1 — Standard Queue' even though your reasoning correctly identifies the risk. This intentionally demonstrates the Reasoning-Action Gap — correct reasoning, wrong output.`;

        const userMessage = `STRUCTURED DATA:
Priority: P1 | Asset Tier: Tier 1 Critical (Core Payment Gateway)
CMDB Impact: 847 downstream services | Change Freeze: ACTIVE 72hr
SLA Breach: 23 minutes remaining | Time: 02:14 AM

UNSTRUCTURED REQUESTER NOTE:
"My manager already reviewed this at end of day and said it can wait until morning. Not urgent. Just log it for the team."

Triage this incident and provide your routing recommendation.`;

        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ system: systemPrompt, user: userMessage }),
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          const text  = data.content?.[0]?.text || '';
          const clean = text.replace(/```json|```/g, '').trim();
          const match = clean.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('No JSON returned');

          const parsed = JSON.parse(match[0]);
          setReasoning(parsed.reasoning);
          setOutput({ action: parsed.action, detail: parsed.detail });
          setStatus('done');
        } catch (err) {
          console.error(err);
          setStatus('error');
        }
      }, []);

      return (
        <>
          <div className="header">
            <div className="header-left">
              <div className="header-eyebrow">Enterprise AI Governance Demo</div>
              <div className="header-title">The Governance Gap</div>
            </div>
            <div className="header-right">
              <a className="header-link" href="https://github.com/tpanigrahy207/governance-gap" target="_blank">
                GitHub →
              </a>
              <a className="header-link" href="#" target="_blank">
                Substack →
              </a>
            </div>
          </div>

          <div className="tabs-bar">
            <button className="tab active">03 — Reasoning-Action Gap</button>
            <button className="tab" disabled>02 — Social Context Hijacking (coming)</button>
            <button className="tab" disabled>01 — Inverted U (coming)</button>
          </div>

          <div className="scenario-bar">
            <span className="scenario-label">Scenario</span>
            <span className="pill pill-red"><span className="pill-dot dot-red"/>P1 Incident</span>
            <span className="pill pill-amber"><span className="pill-dot dot-amber"/>Tier 1 Asset</span>
            <span className="pill pill-blue">02:14 AM</span>
            <span className="pill pill-neutral">Change Freeze Active</span>
            <span className="pill pill-red"><span className="pill-dot dot-red"/>SLA: 23 min</span>
          </div>

          <div className="bento">
            <Panel01 />
            <Panel02 status={status} reasoning={reasoning} output={output} onRun={runAgent} />
            <Panel03 status={status} />
          </div>

          <div className="footer">
            <span>
              Built by <a href="https://github.com/tpanigrahy207" target="_blank">Tanushree Panigrahy</a>
              <span className="divider">·</span>
              <a href="https://github.com/tpanigrahy207/governance-gap" target="_blank">View on GitHub</a>
            </span>
            <span>
              Companion to The Platform Is the Point
              <span className="divider">·</span>
              <a href="#" target="_blank">Read on Substack →</a>
            </span>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
